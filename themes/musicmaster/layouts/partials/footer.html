<!-- Footer Partial -->
<footer class="footer">
    <div class="container">
        <div class="footer-bottom">
            <p>&copy; Copyright {{ now.Format "2006" }}. {{ i18n "text_footer_all_rights" }}</p>
            {{ if eq .Lang "en" }}
            <nav class="footer-legal-links" aria-label="Company and legal information">
                <a href="mailto:{{ .Site.Params.support_email }}">Contact</a>
                <a href="{{ "privacy" | relLangURL }}">Privacy Policy</a>
                <a href="{{ "eula.txt" | relURL }}" target="_blank" rel="noopener noreferrer">Terms / EULA</a>
                <a href="{{ "refund-policy" | relLangURL }}">Refund Policy</a>
                <a href="{{ "seller-information" | relLangURL }}">Seller information</a>
            </nav>
            {{ else }}
            <nav class="footer-legal-links" aria-label="Informacje prawne i dane firmy">
                <a href="mailto:{{ .Site.Params.support_email }}">Kontakt</a>
                <a href="{{ "privacy" | relLangURL }}">Polityka prywatności</a>
                <a href="{{ "eula.txt" | relURL }}" target="_blank" rel="noopener noreferrer">Warunki / EULA</a>
                <a href="{{ "refund-policy" | relLangURL }}">Polityka zwrotów</a>
                <a href="{{ "seller-information" | relLangURL }}">Informacje o sprzedawcy</a>
            </nav>
            {{ end }}
        </div>
    </div>
</footer>
